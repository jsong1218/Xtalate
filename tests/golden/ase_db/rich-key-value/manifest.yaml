notes: >-
  The minimal-molecule + laundering anchor: one bare water row with only symbols and positions. ASE always hands back a fully-populated Atoms, so this fixture proves the parser launders every manufactured default back to absence (P3) on a *real committed* file — the all-zero 3x3 cell -> None, Z-derivable masses -> None, zeroed momenta -> dynamics.velocities None, the empty constraints list -> None, and ASE's generated id/ctime/mtime/user + empty kv dict -> absent. The rich key-value set and data blob still carry into user_metadata.custom_global (carry, never interpret).
