notes: >-
  The VASP 5.x second-layout golden (M43-S2): the same hand-verified H2O run as the
  relax-h2o 6.x golden, re-spelled in the 5.4.4 layout with the documented 5.x<->6.x
  whitespace/column/label drift (narrower 7-decimal fixed columns, scientific-notation
  'in kB', tightened energy/ions/NIONS lines, 5.x-era POTCAR/VRHFIN wording). A
  fixed-column parser that assumed the 6.x widths would mis-split these rows; the
  anchor-string + str.split() reader maps them to the identical canonical values, so
  the two layouts agree with vasprun.xml (the S2 go/no-go gate).
