notes: "The NpT golden (VASP 6.x): 3 ionic steps with per-step cells 10.0 -> 10.1 -> 10.2 A. The initial direct lattice vectors block (10.0 A) is the header; each later step's own block overrides the running cell — a parser that reused the initial lattice would silently keep every frame at 10.0 A (the trap this fixture catches). Positions are Cartesian and scale with the cell (H at (5.05, 7.575, 5.05) in the 10.1 A cell), read as-is. Hydrostatic 'in kB' = 1602.1766208 x [1,1,1,0,0,0] -> tension-positive stress -[1,1,1] on the diagonal."
