notes: >-
  The atomic-style golden (M48-S1): atom style 'atomic' (id type x y z), declared-free metal units resolved by ambiguous_units, a Masses table -> atoms.masses, an orthogonal box read straight from the edge params (box_from_edges, no bounding-box inversion), and out-of-order ids sorted ascending. No velocities (dynamics.velocities None, P3), no topology. The expected canonical is the object produced under ambiguous_units=metal + species_map '1:Ar 2:Ne'.
