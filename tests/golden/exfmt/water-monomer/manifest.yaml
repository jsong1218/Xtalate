notes: >-
  The round-trip matrix's anchor for exfmt (M36 S2). exfmt is provided by the installed
  reference plugin (plugins/example-format/), whose golden fixtures are not part of its built wheel,
  so the matrix — which runs from this checkout, not the installed distribution — needs the anchor
  here under tests/golden/. This is a byte-exact mirror of the plugin's own water-monomer case;
  both copies are hash-governed (this corpus, and the plugin's own suite), so neither can drift
  silently. Label-free: species + Cartesian positions only, everything else absent (P3) — the
  lossless case that flows cleanly through every hop of the n x n matrix.
