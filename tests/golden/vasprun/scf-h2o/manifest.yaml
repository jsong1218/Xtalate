origin:
  kind: synthetic
  source: 'Hand-written for M42-S2 (classical VASP 5.4 layout, root <modeling.vasprun>,
    H2O in a 10 A cubic box, single-point SCF: one <calculation> with energy + forces
    and no per-step <structure>)'
  license: Apache-2.0
notes: "The single-step SCF golden: one <calculation> step whose geometry is the initial\
  \ structure\ncarried forward (the fixed-cell, no-inner-structure form). Hand-verifiable:\
  \ O at direct\n(0.5, 0.5, 0.5) and H at (0.5, 0.75, 0.5) / (0.75, 0.5, 0.5) times\
  \ the 10 A lattice give\nCartesian (5, 5, 5), (5, 7.5, 5), (7.5, 5, 5); e_0_energy\
  \ -76.4 eV and the forces are\nverbatim. The 1-based species indices in the atoms\
  \ array (2 = O, 1 = H) pair with the\natomtypes Z column (8, 1) to derive symbols\
  \ from the element table. The rec_basis varray in\nthe initial structure exercises\
  \ the unmapped-array carry to custom_global; the energy-block\nscalars (e_fr_energy,\
  \ e_wo_entrp, eentropy, efermi, eatom, alpha) exercise the per-frame\ncarry to custom_per_frame['vasprun:*'].\
  \ The step carries no <varray name=\"stress\">, so\nelectronic.stress reads None\
  \ \u2014 the P3 absence case the M42-S3 stress golden pins (a stress-less\nSCF run\
  \ must never read a defaulted zero tensor)."
