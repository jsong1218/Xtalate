notes: >-
  The wrapped-plus-image-flags proof fixture (M46-S3): a single-frame dump in declared metal
  units whose x/y/z coordinates are wrapped in the 10 A box and whose ix/iy/iz columns record
  the periodic images (atom 2 at wrapped (0.5,0.5,0.5) with ix=1). The parser carries the
  flags specifically to custom_per_atom['lammps_dump:image_flags'] with
  LAMMPSDUMP_IMAGE_FLAGS_CARRIED and NEVER applies them on parse (D43) — the positions stay
  wrapped. Its xu-counterpart-metal sibling describes the same physical trajectory with
  unwrapped xu/yu/zu; the test applies the flags (wrapped + flags*cell) and proves the two
  reconstruct identically, so the carried flags are sufficient to unwrap.
