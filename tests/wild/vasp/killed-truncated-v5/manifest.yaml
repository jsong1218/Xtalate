findings:
  - >-
    The honest refusal for a job killed mid-write (D166): the file ends after the second step's
    POSITION/TOTAL-FORCE table but before its energy(sigma->0) summary — a torn tail,
    indistinguishable from a complete step. The reader refuses with OUTCAR_TRUNCATED (never a
    defaulted energy, P3) and offers the `truncate_corrupt_tail` recovery, which keeps the
    already-read first step as good science. This is a *correct* refusal, not a bug: the corpus
    pins it so the reader can neither start silently defaulting the missing energy nor stop
    offering the truncation recovery.
notes: >-
  The killed/truncated dimension. A real VASP run killed by the scheduler leaves exactly this
  shape — whole steps followed by one torn step — so the file is authored by cutting a known-good
  two-step run at the point a kill would land. The declared `parse_error` is the whole
  expectation: a refused file produces no ParseIssues and no structure, so there is no
  issue-code set and no frame count to declare.
