findings:
  - >-
    The honest refusal for a job killed mid-write (M52-S3/D197): the file ends inside step 2's
    force block — a torn tail indistinguishable from a complete step. The reader refuses with
    QEOUT_TRUNCATED (never a partial silent parse, P1/P4) and offers the
    truncate_corrupt_tail recovery, which keeps step 1 as good science. This is a *correct*
    refusal, not a bug: the corpus pins it so the reader can neither start silently keeping
    corrupt tails nor stop offering the truncation recovery.
notes: >-
  The killed/truncated dimension (M53-S1 dimension 4). The declared parse_error is the whole
  expectation: a refused file produces no ParseIssues and no structure, so there is no
  issue-code set and no frame count to declare. The companion case
  killed-truncated-7x-h2o-recovered declares the same file's recovery under
  truncate_corrupt_tail=truncate.
