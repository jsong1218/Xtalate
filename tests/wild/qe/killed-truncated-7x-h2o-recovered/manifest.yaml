notes: >-
  The recovery half of the killed/truncated dimension (M53-S1 dimension 4): the same torn
  file read under the shared truncate_corrupt_tail scenario (truncate_at_last_valid_frame →
  truncate, Revision 1.15; the xdatcar/outcar pattern, M52-S3). The kept prefix is step 1
  (frame_count 1); the dropped tail is recorded as the QEOUT_TRUNCATED warning and the kept
  step's 'total force' carry fires QEOUT_UNMAPPED_BLOCK_CARRIED — the exact set a reader must
  reproduce, so a recovery that silently kept a different prefix or stopped recording the
  truncation fails here.
