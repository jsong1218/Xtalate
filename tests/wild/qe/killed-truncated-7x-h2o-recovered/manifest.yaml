  source: "Same bytes as killed-truncated-7x-h2o (M53-S1): the QE 7.x pw.x output of a run killed mid-write, declared here under its truncate_corrupt_tail recovery."
  license: "Apache-2.0"
expectation:
  issue_codes:
    - QEOUT_UNMAPPED_BLOCK_CARRIED
    - QEOUT_TRUNCATED
  frame_count: 1
  parse_recover:
