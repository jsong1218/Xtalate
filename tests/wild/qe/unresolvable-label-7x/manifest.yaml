expectation:
  parse_error: QEIN_UNRESOLVED_SPECIES_LABEL
findings:
  - >-
    The honest refusal for a label that forms no element (M50-S3/D191): 'Jx' — neither the
    two-character prefix nor the one-character prefix is an element symbol, so the reader
    refuses QEIN_UNRESOLVED_SPECIES_LABEL with the supply_species recovery hint
    (missing_species / species_map / upload_reference) rather than guessing an element
    (P4). This is a *correct* refusal, not a bug: the corpus pins it so the reader can
    neither start guessing elements for unknown labels nor stop offering the recovery.
notes: >-
  The unresolvable side of the decorated-label dimension (M53-S1 dimension 5). A refused file
  produces no object, so the whole expectation is the parse_error; there is no issue-code set
  and no frame count to declare.
