notes: >-
  The unconverged-run dimension (M53-S1 dimension 3): one ionic step whose SCF never
  converged — QE's own 'convergence NOT achieved after 100 iterations' fires the
  QEOUT_UNCONVERGED warning while the present-with-value energy (P3) is still read and
  converted (Ry→eV), so a training set sees the flag, never a withheld value. The
  QEOUT_UNMAPPED_BLOCK_CARRIED is the step's 'total force' scalar carry (P1). The exact-set
  rule pins both: a parser that stopped flagging the unconverged SCF, or one that invented a
  warning for an ordinary 7.x file, would fail here.
