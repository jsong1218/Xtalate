notes: >-
  The real-units data wild case (M49-S1 dimensions 1/3): an atomic-style data file in the real
  unit system — the second dominant MLIP/bio style — whose Masses rows carry element comments
  (1 39.948 # Ar) a human reader maps to the species_map the manifest declares; the parser
  itself resolves types only through the explicit missing_species recovery, never by reading
  comments silently (R3). The Atoms rows are deliberately written out of id order, as LAMMPS
  does not guarantee, so the id-sorted read is exercised. The compound parse-time recovery's
  notes are the exact issue multiset. roundtrip: checked — the export regenerates the Masses
  section from atoms.masses and the re-parse (via reparse_recovery, D182) reproduces the
  object. Authoring follows D167: the shape generalizes the committed M48 golden
  atomic-metal-ortho.
