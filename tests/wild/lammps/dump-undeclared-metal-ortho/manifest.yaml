  declared ambiguous_units=metal preset. The recovery's LAMMPSDUMP_UNITS_INTERPRETED note lands
  in the exact issue multiset. roundtrip: checked — the export writes the resolved style as a
  declared ITEM: UNITS header (the write side needs the same resolution the read did, M47-S1),
  so the re-parse is self-describing and the two objects agree on the carried style.
  Authoring follows D167: the shape generalizes the committed M46 golden metal-ortho-declared,
  with the units preamble removed.
