# xtalate-toyanalysis — a minimal, installable third-party Xtalate *analysis* plugin.
#
# This is NOT a shipped package. It lives under tests/fixtures/ and is installed only in CI
# (and on demand locally) so the analysis entry-point discovery path in `xtalate.registry` is
# exercised against a *real* installed distribution — resolved from actual dist-info metadata by
# `importlib.metadata.entry_points()` under the `xtalate.analysis` group — not just an in-tree
# toy plugin.
#
# It is the third application of the `xtalate-toyfmt` proof pattern (parser+exporter fixture,
# M16B), now for the analysis plugin kind (v1.8 M71). Its sole authority is the published
# contributor docs: it was written from `docs/DEVELOPER_GUIDE.md` §8 ("Writing an analysis
# plugin") alone, without copying the first-party reference plugin — the standing proof that a
# third party can ship an analysis plugin from the docs, against only the frozen public SDK, with
# zero core edits. Where it would have to deviate from the docs, the docs are the bug.
#
# Synthetic Apache-2.0 (matching the parent repo) — deliberately self-contained so it has no
# coupling to the golden-corpus governance suite (which scans only tests/golden/, never here).
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xtalate-toyanalysis"
version = "0.0.1"
description = "Example third-party Xtalate analysis plugin (test fixture): trivial, absence-honest metrics."
requires-python = ">=3.11"
license = "Apache-2.0"
# `xtalate` is always already present in the environment this fixture is installed into (it is
# installed alongside the library under test). Declared for realism — a true third-party plugin
# depends on the SDK — but CI installs this fixture with `--no-deps` so pip never tries to resolve
# `xtalate` from an index (it is not published to PyPI yet; D52). No numpy: the plugin is
# deliberately dependency-free beyond the SDK, so the "in an afternoon" bar is literal.
dependencies = ["xtalate"]

# The whole point of the fixture: advertise an analysis plugin under the Xtalate analysis
# entry-point group, exactly as a real plugin distribution would (DEVELOPER_GUIDE §8.4).
[project.entry-points."xtalate.analysis"]
toyanalysis = "xtalate_toyanalysis.analysis:ToyAnalysis"

[tool.hatch.build.targets.wheel]
packages = ["src/xtalate_toyanalysis"]
