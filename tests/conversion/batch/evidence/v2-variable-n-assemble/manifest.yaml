expectation:
  parse_error: EXTXYZ_VARIABLE_ATOM_COUNT
  frame_count: 0
notes: >-
  The v2.0 variable-N evidence case the assemble mode produces (M54-S2, D203): the assembled
  extXYZ has 3-atom frames followed by 2-atom frames, so a single-object re-parse refuses with
  the existing EXTXYZ_VARIABLE_ATOM_COUNT (Part 2 §3.2) — the refusal the parser already enforces
  for any one file, here reached by assembling constant-N sources into a variable-N artifact. The
  BatchReport carries this as a dataset-level note (never a per-file loss); per-contribution
  validations of each source's own segment stay green. Measured, never padded or truncated —
  the case joins the counted evidence stream alongside the LAMMPS deposition dump
  (tests/wild/lammps/dump-variable-n-deposition).
