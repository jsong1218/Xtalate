case: v2-variable-n-assemble
format_id: extxyz
source_file: assembled.extxyz
origin:
  kind: synthetic
  source: "Generated by Xtalate's own assemble output mode (v1.5 M54-S2): two ordinary sources of differing composition — tests/golden/xyz/water-traj/water_traj.xyz (3 atoms) and tests/golden/extxyz/co-in-cell/sample.extxyz (2 atoms) — converted to extXYZ and concatenated in manifest order. The assembled file is a valid MLIP training set with variable N across frames; since schema 2.0 (M72) it IS one variable-N Canonical Object."
  license: "Apache-2.0"
expectation:
  frame_counts: [3, 3, 2]
notes: >-
  The v2.0 variable-N evidence case the assemble mode produces (M54-S2, D203; M73-S5): the
  assembled extXYZ has 3-atom frames followed by a 2-atom frame. Before schema 2.0 a single-object
  re-parse refused with EXTXYZ_VARIABLE_ATOM_COUNT; since M72 lifted the constant-N invariant and
  M73-S4 retired that reader refusal, it now reads through as one variable-N object (Part 2 §3.2) —
  each frame at its own measured atom count. The BatchReport carries the variable-N property as a
  dataset-level note (never a per-file loss) and validates the assembled whole; per-contribution
  validations of each source's own segment stay green too. Measured, never padded or truncated —
  the case joins the counted evidence stream alongside the LAMMPS deposition dump
  (tests/wild/lammps/dump-variable-n-deposition).
