  source: "Generated by Xtalate's own assemble output mode (v1.5 M54-S2): two ordinary sources of differing composition — tests/golden/xyz/water-traj/water_traj.xyz (3 atoms) and tests/golden/extxyz/co-in-cell/sample.extxyz (2 atoms) — converted to extXYZ and concatenated in manifest order. The assembled file is a valid MLIP training set with variable N across frames; it is NOT one Canonical Object."
