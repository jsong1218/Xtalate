# Xtalate — Tier 1 local stack (MASTER_SPEC Part 9 §1.1; IMPLEMENTATION_PLAN_v0.5 M21 deliverable 5).
#
# `docker compose up` boots the service against the *real* backends it uses in production —
# PostgreSQL and S3-compatible object storage (MinIO) — plus the Redis the M22 worker will consume.
# The done-means: after this comes up, `curl localhost:8000/v1/health?ready=true` is green, and the
# adapter parity suites' Tier 1 legs can run against these services (they read XTALATE_TEST_*).
#
# Credentials below are LOCAL-DEV THROWAWAYS with weak defaults — never production secrets, and no
# real secret is committed (CLAUDE.md "Never commit secrets"). Override every value via the
# environment (or an untracked .env, which `docker compose` loads automatically) for anything real;
# `${VAR:-default}` interpolation means the environment always wins. See `.env.example`.
#
# M25 finalizes this stack: the backend gains a readiness healthcheck (so the worker and the CI
# integration job wait for migrations, not just a started process), and one `docker compose up`
# yields the full upload → inspect → convert (pause/resume) → validate → download loop, expiry
# included. Further polish (profiles, resource hints) stays out of scope by the M25 cut line.

# Shared service configuration for the two processes on the one image — API and worker — so they
# never drift on which database/store/queue they use (Part 9 §2, one artifact, no skew).
x-backend-env: &backend-env
  XTALATE_ENVIRONMENT: tier1
  XTALATE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-xtalate}:${POSTGRES_PASSWORD:-xtalate}@postgres:5432/${POSTGRES_DB:-xtalate}
  XTALATE_OBJECT_STORE_BACKEND: s3
  XTALATE_OBJECT_STORE_ENDPOINT: http://minio:9000
  XTALATE_OBJECT_STORE_BUCKET: ${XTALATE_OBJECT_STORE_BUCKET:-xtalate}
  XTALATE_OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-xtalate}
  XTALATE_OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-xtalate-local-dev}
  XTALATE_REDIS_URL: redis://queue:6379/0
  # Tier 1 uses the RQ queue: the backend enqueues, the worker executes (M22).
  XTALATE_QUEUE_BACKEND: rq
  # Defaults to the application's own 100 MB ceiling, so a plain `docker compose up` is unchanged.
  # The M30 e2e lane exports a small value here so the oversized-upload journey trips the real
  # `413 FILE_TOO_LARGE` gate with a kilobyte-scale file instead of a genuine 100 MB transfer.
  XTALATE_MAX_UPLOAD_BYTES: ${XTALATE_MAX_UPLOAD_BYTES:-104857600}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xtalate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xtalate}
      POSTGRES_DB: ${POSTGRES_DB:-xtalate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback-only publish: reachable from the host (psql, the restore drill) but NOT from the LAN.
    # A bare "5432:5432" binds 0.0.0.0 and exposes the DB to the whole network — a LBNL network scan
    # flagged exactly that. Services reach each other over the compose network by name (postgres:5432),
    # so this host-side bind never needs to leave loopback. Same rule applies to every publish below.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xtalate} -d ${POSTGRES_DB:-xtalate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xtalate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xtalate-local-dev}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the private bucket and install the byte-expiry lifecycle rules, so §5.2
  # byte-expiry is locally testable (expiry is the storage platform's job, never an app cron). M24
  # refines the M21 single-rule shape into **per-prefix** windows: `uploads/` and `outputs/` expire
  # independently (their retention hours differ in config), matching the two byte windows the app
  # advertises. MinIO's ilm granularity is whole days, so both default to 1 day here (the config
  # defaults are 24 h) — short enough to prove expiry locally. The record-retention window is a
  # different, much longer thing swept in-app (`backend.jobs.retention`), not a bucket rule.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xtalate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xtalate-local-dev}
      BUCKET: ${XTALATE_OBJECT_STORE_BUCKET:-xtalate}
      UPLOAD_EXPIRE_DAYS: ${XTALATE_UPLOAD_EXPIRE_DAYS:-1}
      OUTPUT_EXPIRE_DAYS: ${XTALATE_OUTPUT_EXPIRE_DAYS:-1}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"local/$$BUCKET\" &&
      mc anonymous set none \"local/$$BUCKET\" &&
      mc ilm rule add --expire-days \"$$UPLOAD_EXPIRE_DAYS\" --prefix 'uploads/' \"local/$$BUCKET\" || true &&
      mc ilm rule add --expire-days \"$$OUTPUT_EXPIRE_DAYS\" --prefix 'outputs/' \"local/$$BUCKET\" || true &&
      echo 'minio-init: bucket ready with per-prefix uploads/ + outputs/ expiry'
      "
    restart: "no"

  queue:
    image: redis:7-alpine
    # Loopback-only: this Redis has no auth, so it must never be reachable off the host.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      queue:
        condition: service_healthy
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:${XTALATE_PORT:-8000}:8000"
    # Ready — not merely alive — so the worker (and the CI integration job) wait until migrations
    # have run and the database + object store answer. The slim image ships no curl/wget, so the
    # probe is a stdlib Python one-liner; ``?ready=true`` is exactly the M21 done-means check.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/health?ready=true').status==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # The RQ worker (M22): the same image, the second entrypoint (Part 9 §2). It executes the jobs the
  # backend enqueues onto Redis. Migrations are the backend's job (its CMD runs `alembic upgrade
  # head`), so the worker only waits for the queue and runs.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "backend.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      queue:
        condition: service_healthy
      backend:
        # Wait until the backend is *healthy* — i.e. it has finished ``alembic upgrade head`` — so
        # the worker never races the schema it reads (the backend owns migrations, Part 9 §2).
        condition: service_healthy
    environment:
      <<: *backend-env

  # The Next.js web UI (v0.6 M26; the Part 9 §1.2 row deferred from v0.5). Dev server with hot
  # reload behind a same-origin `/v1` proxy to the backend (next.config.mjs) — so the browser never
  # sees a cross-origin API and there is no hard-coded API host in client code. Production build and
  # hosting are M30 (Part 9 §3); this service exists to develop against the live stack.
  #
  # It runs the stock Node image and installs on start (rather than a build step) so the bind-mounted
  # source hot-reloads and the typed-client generator can read the committed OpenAPI artifact at
  # ../docs/openapi.json (mounted read-only). node_modules is a named volume so it stays off the host
  # tree and avoids a host/container platform mismatch.
  frontend:
    image: node:20-alpine
    working_dir: /repo/frontend
    command: ["sh", "-c", "npm install && npm run dev"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server-side (RSC) calls reach the backend in-cluster; the browser uses the same-origin proxy.
      INTERNAL_API_URL: http://backend:8000
      API_PROXY_TARGET: http://backend:8000
      # The same upload ceiling the backend enforces: next.config.mjs sizes the rewrite proxy's
      # body-clone limit above this, so an upload the backend would accept is never truncated at the
      # proxy (Next's 10 MB default otherwise 500s any larger upload). The e2e lane exports a small
      # value here just as it does for the backend, so both stay in agreement.
      XTALATE_MAX_UPLOAD_BYTES: ${XTALATE_MAX_UPLOAD_BYTES:-104857600}
      # Reliable hot reload on bind mounts across host platforms.
      WATCHPACK_POLLING: "true"
      # Inside the container the dev server must bind all interfaces so Docker's port proxy can reach
      # it; `::` is dual-stack (IPv4 + IPv6), matching Next's original no-`-H` default so the busybox
      # healthcheck (`wget localhost`, which resolves to ::1) still connects. The *host* side stays
      # loopback-only via the `ports:` bind below — same layering as the Dockerfile's uvicorn. On a
      # bare host `npm run dev` (no XTALATE_DEV_HOST) defaults to 127.0.0.1, never the LAN.
      XTALATE_DEV_HOST: "::"
    volumes:
      - ./frontend:/repo/frontend
      - ./docs:/repo/docs:ro
      - frontend_node_modules:/repo/frontend/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # Serving — not merely started — so `docker compose up --wait` (and the M30 e2e lane) block until
    # the dev server actually answers, past the on-start `npm install` and the first Next compile.
    # busybox `wget` ships in the node:20-alpine image; a long start_period covers the cold install.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

volumes:
  pgdata:
  frontend_node_modules:
  miniodata:
