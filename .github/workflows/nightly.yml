name: nightly

# The scheduled companion to ci.yml (MASTER_SPEC Part 8 §5, Part 9 §3). The PR suite is capped near
# ten minutes; anything super-linear in formats or frames is deferred here, never dropped (M15B). A
# nightly failure opens an issue automatically rather than blocking anyone's PR — visible, tracked,
# not a surprise tax on unrelated work.
on:
  schedule:
    # 07:00 UTC daily — off the working day, well clear of PR-triggered runs.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

# issues:write lets the failure step open the tracking issue; nothing else here needs write access.
permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Single interpreter (3.13, the dev floor's upper leg, DECISIONS.md D11): the deferred work
      # here — the matrix, benchmarks, extended properties, audit — is not interpreter-sensitive the
      # way the syntax-floor guard is, so the 3.11×3.13 fan-out stays on the PR (ci.yml).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Install the reference plugin (M36) so exfmt is registered before the matrix runs — its
      # exporter makes it a round-trip target and its golden anchor makes it a source, so the
      # `exfmt ↔ *` pairs (nightly-only: exfmt is not in the curated PR subset) are exercised across
      # the full n×n matrix. Without this the matrix would silently omit exfmt (its source enrolment
      # is gated on the parser being registered — tests/roundtrip/_matrix.py), defeating the
      # milestone's "appears in the nightly matrix with zero core changes". `--no-deps` as elsewhere.
      - name: Install reference plugin (M36 — enrols exfmt in the matrix)
        run: pip install --no-deps ./plugins/example-format

      # Stage 1 — the full n×n round-trip matrix beyond the curated PR subset (Part 8 §2.4).
      # XTALATE_FULL_MATRIX=1 un-gates the `nightly`-marked pairs (tests/conftest.py); `-m nightly`
      # then runs *only* them — the curated high-risk pairs already ran on the PR, so re-running them
      # here would be waste. --no-cov because the coverage ratchet is a PR gate: this deliberately
      # narrow subset would never clear the --cov-fail-under floor, and coverage is not what nightly
      # is measuring.
      - name: Full round-trip matrix
        env:
          XTALATE_FULL_MATRIX: "1"
        run: pytest -m nightly --no-cov

      # Stage 2 — the performance corpus (Part 8 §4), measured not gated: a budget breach is
      # reported, only a *crash* fails the step (non-zero exit). The >20% regression tripwire is
      # deliberately NOT run here — shared `ubuntu-latest` timings are too noisy to be a baseline. It
      # runs in the `perf-tripwire` job below, on the pinned runner, where timings are comparable
      # (M37 S2; docs/ops/pinned-runner.md). This step keeps producing the measured-only series so the
      # trend stays visible even before a pinned runner exists.
      - name: Performance benchmarks
        run: python -m benchmarks --out benchmark-results

      # The wall-time + peak-RSS series (JSON + CSV) — the artifact a maintainer downloads to chart
      # the trend. always() so a benchmark crash still uploads whatever series was written before it.
      - name: Upload benchmark series
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: warn

      # Stage 3 — the extended property run at the widened hypothesis budget (max_examples=2000).
      # HYPOTHESIS_PROFILE=nightly selects the `nightly` profile registered in tests/conftest.py; the
      # PR run caps the same suite at the cheap `pr` profile. --no-cov for the same reason as stage 1.
      - name: Extended property tests
        env:
          HYPOTHESIS_PROFILE: nightly
        run: pytest tests/property --no-cov

      # Stage 4 — dependency vulnerability audit (Part 8 §5). Advisory, not blocking:
      # continue-on-error keeps a fresh advisory against a pinned dependency visible (the step goes
      # yellow) without failing the job or opening a spurious issue. pip-audit is a dev-extra.
      - name: Dependency audit
        continue-on-error: true
        run: pip-audit

  # The >20% regression tripwire (M37 S2; Part 8 §4 / §6 item 5) — the gate the measured-only
  # benchmark step cannot be. It runs ONLY on the pinned runner, where timings are comparable enough
  # for a relative-regression bound to hold, and it commits the trailing series back so future
  # medians include this run.
  #
  # GATED by a repo variable so it is *skipped* — never queued forever against a non-existent
  # self-hosted runner, never red — until the maintainer registers the pinned runner (labels:
  # `self-hosted`, `xtalate-pinned`) and sets `vars.XTALATE_PINNED_RUNNER == 'true'`. Runbook:
  # docs/ops/pinned-runner.md.
  perf-tripwire:
    if: vars.XTALATE_PINNED_RUNNER == 'true'
    runs-on: [self-hosted, xtalate-pinned]
    permissions:
      contents: write # to commit the appended benchmarks/history/<runner>.jsonl series back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run the full corpus, compare against this runner's trailing-14-day median, append the run to
      # the series, and EXIT NON-ZERO on a >20% regression (failing the job → the tracking issue).
      # --runner keys the series file; a crashed benchmark is reported and never appended.
      - name: Performance benchmarks + regression tripwire
        run: python -m benchmarks --tripwire --runner xtalate-pinned --out benchmark-results

      # Upload the measurement artifact regardless of the tripwire verdict (the §6-item-5 evidence).
      - name: Upload benchmark series
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-pinned
          path: benchmark-results/
          if-no-files-found: warn

      # Commit the appended series back so the median is durable. always() because a *regression*
      # still appended its run (we want it recorded); a crash appended nothing, so `git diff` is
      # empty and this is a no-op. [skip ci] avoids any accidental trigger loop.
      - name: Commit benchmark series
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- benchmarks/history/; then
            echo "no series change to commit"
            exit 0
          fi
          git add benchmarks/history/
          git commit -m "[skip ci] chore(benchmarks): append nightly series (${GITHUB_SHA::7})"
          # actions/checkout leaves a detached HEAD; push explicitly to the branch this ran on.
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # A failure in a nightly job (a crashed benchmark, a red matrix, a broken property, a tripped
  # regression) opens a tracking issue — the "failures auto-open issues" of Part 9 §3, so the
  # scheduled run is visible without anyone watching the Actions tab. The dependency audit is excluded
  # by design (it is continue-on-error, so an advisory never reaches here). Its own failure is
  # swallowed (`|| true`): the issue is a courtesy, never a second thing that can break the pipeline.
  open-issue-on-failure:
    needs: [nightly, perf-tripwire]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly failure — $(date -u +%Y-%m-%d)" \
            --body "The scheduled nightly workflow failed. Run: ${RUN_URL}" \
            || true
