# OpenSSF Scorecard — supply-chain security posture (v1.2).
#
# Scorecard scores the repository against a set of security heuristics (pinned dependencies,
# branch protection, token permissions, dangerous workflow patterns, published releases, …) and
# writes the findings to GitHub's code-scanning surface as SARIF, so a regression shows up as a
# code-scanning alert on the default branch. It runs on push to `main` and weekly (so a finding
# that appears from an upstream change, e.g. a new advisory, is caught even without a push), plus
# a manual trigger.
#
# Every workflow — ci.yml / main.yml / nightly.yml / codeql.yml / cflite_*.yml and this one — pins
# its actions by full commit SHA (with the version in a trailing comment), which is itself one of
# the checks Scorecard rewards: an unpinned supply-chain action anywhere would undercut the very
# thing being measured. The SHAs below are the ones OpenSSF pins in its own scorecard-analysis
# workflow; bump them (and the comment) together when updating. Dependabot (`.github/dependabot.yml`,
# the grouped `github-actions` ecosystem) now proposes pin bumps as review-gated PRs, so a drifting
# action surfaces as a PR the maintainer reviews rather than needing a manual sweep.
#
# KNOWN, ACCEPTED SCORECARD EXCEPTIONS (documented, v1.5 review R10; deliberate policy decision, not
# an oversight — present both sides and record the choice):
#   (i) The CI `pip install --no-deps ./tests/fixtures/…` and editable installs that Scorecard's
#       `Pinned-Dependencies` probe cannot fully score. There is nothing to pin: these are local-path
#       installs of the in-tree test fixture package and the in-tree example plugin, not third-party
#       dependencies fetched from a registry, so a SHA/digest pin is meaningless. Every genuine
#       third-party supply-chain edge (GitHub Actions `uses:` refs and every Docker `FROM`) is
#       already SHA/digest-pinned and was confirmed current in the v1.4/v1.5 architectural review; no
#       open Dependabot alerts exist. Accepted deliberately rather than contorting CI to silence the
#       probe.
#   (ii) The solo-maintainer maturity heuristics (`Maintained`, `CII-Best-Practices`, `Code-Review`,
#        `Branch-Protection`). These are intrinsic to a single-maintainer open-source project (every
#        change is authored and merged by the one maintainer, so a second-reviewer gate and a
#        CII-Best-Practices badge are not applicable) and are accepted as-is; they are not resolvable
#        by a code or config change. `Fuzzing` was on this list historically but is now RESOLVED:
#        the v2.0 review added Atheris harnesses run by ClusterFuzzLite (`.clusterfuzzlite/`,
#        `cflite_*.yml`), and `SAST` is resolved by the real CodeQL run (`codeql.yml`).
#
# NOTE for the maintainer: the SARIF upload needs GitHub code scanning enabled for the repo (free on
# public repositories). `publish_results: true` publishes the score to the OpenSSF API, which is what
# powers the Scorecard badge — remove it if a public score is not wanted.

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 03:27 UTC — off-peak, and independent of any push.
    - cron: "27 3 * * 1"
  workflow_dispatch:

# Least privilege by default; the analysis job elevates only the two scopes it needs.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to the code-scanning dashboard.
      security-events: write
      # Publish the score to the OpenSSF API (badge) via keyless OIDC.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Keep the raw SARIF as a short-lived artifact so a run's findings are inspectable even
      # before the code-scanning ingest completes.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
