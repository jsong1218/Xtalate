name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN: this workflow only checks out and
# tests code, so read access to repo contents is all it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported floor (catches use of newer syntax); 3.13 is the
        # local dev interpreter (DECISIONS.md D11) — testing both keeps dev and CI
        # from drifting.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      # The M36 compatibility canary, part 1 of 2: install the reference plugin
      # (plugins/example-format/) *before* lint-imports so its forbidden contract — "the reference
      # plugin builds only on the frozen public SDK" — actually evaluates (import-linter can only
      # check a package it can import). `--no-deps` for the same reason as the toyfmt fixture below:
      # its declared `xtalate` dependency is already satisfied by the editable install, and xtalate
      # is not on any index yet (D52). Unlike toyfmt this is a *required* gate, not a skip-if-absent
      # fixture — a core change that breaks the plugin fails the pytest step below.
      - name: Install reference plugin (M36 compatibility canary)
        run: pip install --no-deps ./plugins/example-format

      # The M69 analysis-plugin canary, part 1 of 2: install the reference *analysis* plugin
      # (plugins/xtalate-analysis-composition/) before lint-imports for the same reason as the M36
      # format plugin above — its forbidden contract, "the reference analysis plugin builds only on
      # the frozen public SDK", can only evaluate a package import-linter can import. `--no-deps`:
      # its declared `xtalate`/`numpy` deps are already satisfied by the editable install. Like
      # example-format and unlike toyfmt, this is a *required* gate, not skip-if-absent — an SDK
      # change that breaks it fails the pytest step below.
      - name: Install reference analysis plugin (M69 compatibility canary)
        run: pip install --no-deps ./plugins/xtalate-analysis-composition

      # Promoted to a required check in v0.2 M11 (Part 10 §1 deferral table, "earliest
      # v0.2"): the import-linter contract from M0 confirmed as a blocking gate.
      - name: Import-graph lint (P2)
        run: lint-imports

      # Install the example third-party plugin (M16B) so entry-point discovery is exercised
      # against a real installed distribution — without it, tests/test_toyfmt_plugin.py skips.
      # `--no-deps`: its declared `xtalate` dependency is already satisfied by the editable install
      # above, and xtalate is not on any index yet (D52), so pip must not try to resolve it.
      - name: Install entry-point discovery fixture (M16B)
        run: pip install --no-deps ./tests/fixtures/xtalate_toyfmt

      # Install the third-party *analysis* plugin fixture (M71) so the analysis entry-point
      # discovery path is exercised against a real installed distribution too — without it,
      # tests/test_toyanalysis_plugin.py skips. Written from docs/DEVELOPER_GUIDE §8 alone against
      # the frozen public SDK; the standing proof a third party can ship an analysis plugin from the
      # docs with zero core edits. `--no-deps` for the same reason as the toyfmt fixture above.
      - name: Install third-party analysis plugin fixture (M71)
        run: pip install --no-deps ./tests/fixtures/xtalate_toyanalysis

      # Pytest enforces the coverage ratchet (--cov-fail-under in pyproject addopts) and the
      # golden-corpus governance suite: manifest schema + license, per-source sha256, the
      # schema-version migration-chain load, and the tests/golden/ATTRIBUTIONS.md regeneration diff
      # (Part 8 §3; v0.2 M11). A silent fixture edit or a lapsed attribution fails here.
      #
      # It also collects tests/test_attributions.py (v1.0 M38, Part 10 §6): the project-level
      # ATTRIBUTIONS.md completeness check — every runtime distribution declared in pyproject.toml
      # (core + the `service` extra) must be attributed in the root ATTRIBUTIONS.md. Add a
      # dependency without its attribution row and this step fails, so the file cannot drift behind
      # the dependency set. (Collected by the ordinary `pytest tests` run below — no separate step,
      # same as the golden-corpus governance suite.)
      #
      # The M36 compatibility canary, part 2 of 2: the reference plugin's own contract suite
      # (plugins/example-format/tests/) is collected here as a *required* part of the run — passing
      # its path explicitly rather than adding it to `testpaths`, so a bare local `pytest` still runs
      # only `tests/` and stays green without the plugin, while CI (which always installs it above)
      # makes it a hard gate. A core change that breaks exfmt's parse/export/capabilities fails here,
      # not silently. One coverage run covers both trees.
      #
      # The M69 analysis-plugin canary, part 2 of 2: the analysis reference plugin's own suite
      # (plugins/xtalate-analysis-composition/tests/) is collected here the same way, beside the
      # format plugin's — so from v1.8 the audit inherits two tripwires instead of one. An SDK
      # change that breaks the reference analysis plugin's contract fails here, not silently.
      - name: Pytest (unit + golden + governance + reference-plugin canaries, with coverage gate)
        run: pytest tests plugins/example-format/tests plugins/xtalate-analysis-composition/tests

  # Frontend lanes (v0.6 M26; Part 8 §5). Fast, fixture-first checks on the presentation layer: the
  # typed client generates from the committed OpenAPI artifact (postinstall runs `gen:api`), then
  # lint + type-check + the Vitest component/unit suite — which includes the plain-language
  # mapping-coverage lint that reads docs/vocabulary.json. The Playwright e2e journeys (D92) need a
  # running stack, so they run in the compose-integration job (main.yml), not on this per-PR gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs from the committed lockfile and runs the postinstall hook, which generates
      # lib/api/schema.d.ts from ../docs/openapi.json — so the typed client exists before type-check
      # and tests. Any hand-patching of that file would mean the OpenAPI artifact is wrong: fix it
      # there and regenerate (the M26 go/no-go checkpoint).
      - name: Install (generates the typed API client)
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Vitest (components + mapping-coverage lint)
        run: npm run test

      # The artifact the release story claims must actually build: `next build` exercises RSC
      # prerendering and the static/dynamic route split, which neither `next dev` (the e2e stack)
      # nor jsdom ever runs — the landing-page static-bake defect (D98) was invisible without it.
      - name: Production build (next build)
        run: npm run build
